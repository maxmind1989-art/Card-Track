<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CardTrack">
<meta name="theme-color" content="#eaf6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1d1b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>CardTrack</title>
<style>
:root{
  --bg:#eaf6f3;--bg2:#e6efff;--grad:linear-gradient(135deg,#0fa86f 0%,#1c6fe0 100%);--surface:#fff;--surface2:#eef0f3;--text:#14161a;--muted:#6b7280;--line:#e3e6ea;
  --accent:#0b8a6a;--accent-ink:#fff;--danger:#c0362c;--warn:#b86e00;--ok:#0a7d5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1d1b;--bg2:#0b1a30;--grad:linear-gradient(135deg,#12a672 0%,#2b6fe0 100%);--surface:#1a1c20;--surface2:#24272c;--text:#eef0f3;--muted:#9aa1ab;--line:#2c3036;
    --accent:#2fbf8c;--accent-ink:#06261b;--danger:#ff6b5e;--warn:#f0a83a;--ok:#2fbf8c;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg) linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 16px 8px;font-weight:600}
main{max-width:640px;margin:0 auto}
.card{background:var(--surface);border-radius:14px;margin:0 16px 10px;padding:14px 16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 10px}
.stats .card{margin:0}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:3px}
.bar.warn>i{background:var(--warn)}.bar.danger>i{background:var(--danger)}
.list{background:var(--surface);border-radius:14px;margin:0 16px 10px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{box-shadow:0 2px 6px rgba(0,0,0,.15);width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.hero{background:var(--grad);color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(28,111,224,.3)}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .bar{background:rgba(255,255,255,.28)}
.hero .bar>i{background:#fff}
.hero .chev{position:absolute;right:16px;top:14px;font-size:13px;font-weight:600;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px}
.seg2{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 12px}
.seg2 i{display:block;height:100%}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.danger{color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--surface2);color:var(--text);font-weight:600;cursor:pointer}
.btn-primary{background:var(--grad);color:#fff}
.btn-danger{background:transparent;color:var(--danger)}
.btn-round{width:40px;height:40px;padding:0;border-radius:50%;background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(28,111,224,.35);font-size:24px;line-height:40px}
.seg{display:flex;align-items:center;gap:8px;margin:4px 16px 4px}
.seg button{padding:8px 12px}
.seg .lbl{flex:1;text-align:center;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid transparent;border-image:var(--grad) 1;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:#1c6fe0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg) linear-gradient(160deg,var(--bg),var(--bg2));width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 0 calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 16px 12px;font-size:20px}
.field{display:block;margin:0 16px 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);appearance:none;-webkit-appearance:none}
input[type=date]{min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.grid2 .field:first-child{margin-right:6px}.grid2 .field:last-child{margin-left:6px}
.actions{display:flex;gap:10px;margin:16px 16px 0}
.actions button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 12px}
.chips button{padding:7px 12px;font-size:14px;border-radius:999px}
.chips button.on{background:var(--grad);color:#fff}
.hint{margin:0 16px 12px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1 id="title">Overview</h1><button class="btn-round" id="addBtn" aria-label="Add">+</button></header>
  <section id="view"></section>
</main>

<nav id="nav">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Cards</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Expenses</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Budget</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'cardtrack.v1';
const COLORS = ['#0a7d5a','#1f5fbf','#a13d8f','#c0572c','#6b4fd8','#00808a','#b8860b','#c0362c','#4a5568'];
const CATS = ['Food','Groceries','Fuel','Rent','Back home','Bills','Phone','Internet','Transport','Shopping','Health','Dining out','Entertainment','Other'];

function seed(){ return {version:1, income:0, cards:[], budgets:[], txns:[]}; }

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
  catch(e){ S = seed(); }
  S.cards ||= []; S.budgets ||= []; S.txns ||= [];
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save'); } }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = n => 'AED ' + (Number(n)||0).toLocaleString('en-AE',{minimumFractionDigits:0,maximumFractionDigits:2});
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const monthKey = d => iso(d).slice(0,7);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dshort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const dim = (y,m) => new Date(y,m+1,0).getDate();
const onDay = (y,m,day) => new Date(y,m,Math.min(day,dim(y,m)));
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
const daysBetween = (a,b) => Math.round((b-a)/86400000);
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// Next due date on or after today for a card
function nextDue(card, from=today()){
  if(!card.dueDay) return null;
  let d = onDay(from.getFullYear(), from.getMonth(), card.dueDay);
  if(d < from) d = onDay(from.getFullYear(), from.getMonth()+1, card.dueDay);
  return d;
}
// The statement date that starts the cycle for a given due date
function cycleStart(card, due){
  if(card.statementDay){
    let s = onDay(due.getFullYear(), due.getMonth(), card.statementDay);
    if(s >= due) s = onDay(due.getFullYear(), due.getMonth()-1, card.statementDay);
    return s;
  }
  const s = onDay(due.getFullYear(), due.getMonth()-1, due.getDate());
  s.setDate(s.getDate()+1);
  return s;
}
function paidThisCycle(card){
  const due = nextDue(card); if(!due) return 0;
  const start = cycleStart(card, due);
  return S.txns.filter(t=>t.type==='payment' && t.cardId===card.id && parseISO(t.date)>=start && parseISO(t.date)<=due)
               .reduce((a,t)=>a+t.amount,0);
}
function dueStatus(card){
  const due = nextDue(card);
  if(!due) return {label:'No due date',cls:''};
  if(card.balance<=0) return {label:'Nothing owed',cls:'ok',due};
  const paid = paidThisCycle(card);
  if(paid>0) return {label:'Paid '+fmt(paid),cls:'ok',due,paid};
  const n = daysBetween(today(), due);
  const label = n===0 ? 'Due today' : n===1 ? 'Due tomorrow' : `Due in ${n} days`;
  return {label, cls: n<=3 ? 'danger' : n<=7 ? 'warn' : '', due, days:n};
}
function payModeText(c){
  if(c.payMode==='installment') return `Installment ${fmt(c.installment)}/mo`;
  if(c.payMode==='min') return 'Paying minimum';
  return 'Pay in full';
}
function monthTxns(mk, type='expense'){ return S.txns.filter(t=>t.type===type && t.date.slice(0,7)===mk); }

// ---------- views ----------
let tab='home', viewMonth=new Date(); viewMonth.setDate(1);

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const titles={home:'Overview',cards:'Cards',spend:'Expenses',budget:'Budget',more:'More'};
  $('#title').textContent=titles[tab];
  $('#addBtn').hidden = tab==='more';
  $('#view').innerHTML = ({home:vHome,cards:vCards,spend:vSpend,budget:vBudget,more:vMore})[tab]();
}

function vHome(){
  const owed = S.cards.reduce((a,c)=>a+(+c.balance||0),0);
  const limit = S.cards.reduce((a,c)=>a+(+c.limit||0),0);
  const mk = monthKey(new Date());
  const spent = monthTxns(mk).reduce((a,t)=>a+t.amount,0);
  const cardPays = monthTxns(mk,'payment').reduce((a,t)=>a+t.amount,0);
  const budget = S.budgets.reduce((a,b)=>a+(+b.amount||0),0);
  const plannedCard = S.cards.reduce((a,c)=>a+(c.payMode==='installment'?(+c.installment||0):0),0);
  const out = spent + cardPays;
  const left = (+S.income||0) - out;
  const util = limit ? owed/limit*100 : 0;
  const upcoming = S.cards.map(c=>({c,st:dueStatus(c)})).filter(x=>x.st.due && x.c.balance>0)
    .sort((a,b)=>a.st.due-b.st.due).slice(0,5);
  return `
  <div class="card hero" id="heroOwed" role="button">
    <span class="chev">Details ›</span>
    <div class="muted small">Total owed on cards</div>
    <div class="big">${fmt(owed)}</div>
    ${limit?`<div class="bar ${util>70?'danger':util>40?'warn':''}"><i style="width:${Math.min(util,100)}%"></i></div>
    <div class="row small muted" style="margin-top:6px"><span>${util.toFixed(0)}% of ${fmt(limit)} limits used</span><span>${S.cards.length} cards</span></div>`:''}
  </div>
  <div class="stats">
    <div class="card"><div class="muted small">Spent in ${MONTHS[new Date().getMonth()]}</div><div class="num" style="font-size:20px;font-weight:700">${fmt(spent)}</div>
      <div class="small muted">Budget ${fmt(budget)}</div>
      <div class="bar ${spent>budget?'danger':''}"><i style="width:${budget?Math.min(spent/budget*100,100):0}%"></i></div></div>
    <div class="card"><div class="muted small">Left this month</div><div class="num" style="font-size:20px;font-weight:700;color:${left<0?'var(--danger)':'inherit'}">${fmt(left)}</div>
      <div class="small muted">Income ${fmt(S.income)}</div>
      <div class="small muted">Card payments ${fmt(cardPays)}</div></div>
  </div>
  <h2>Upcoming card payments</h2>
  ${upcoming.length?`<div class="list">${upcoming.map(({c,st})=>`
    <div class="item" data-card="${c.id}">
      <div class="dot" style="background:${c.color}">${esc(initials(c.name))}</div>
      <div class="grow"><div class="title">${esc(c.name)}</div><div class="small muted">${dshort(st.due)} · ${payModeText(c)}</div></div>
      <span class="pill ${st.cls}">${st.label}</span>
    </div>`).join('')}</div>`:`<div class="list"><div class="empty">No payments coming up.</div></div>`}
  ${plannedCard?`<div class="hint">Fixed installments: ${fmt(plannedCard)} every month.</div>`:''}
  <h2>Recent</h2>
  ${txnList(S.txns.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts).slice(0,6))}
  `;
}

function breakdown(){
  const cards=S.cards.filter(c=>c.balance>0).sort((a,b)=>b.balance-a.balance);
  const owed=cards.reduce((a,c)=>a+c.balance,0);
  const mk=monthKey(new Date()); const tx=monthTxns(mk);
  const byCat={}; tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const spent=tx.reduce((a,t)=>a+t.amount,0);
  const pays=monthTxns(mk,'payment').reduce((a,t)=>a+t.amount,0);
  const inst=cards.filter(c=>c.payMode==='installment'&&c.installment>0).reduce((a,c)=>a+c.installment,0);
  openSheet(`<h3>Total owed ${fmt(owed)}</h3>
    <div class="card"><div class="muted small">By card</div>
      <div class="seg2" style="margin-top:8px">${cards.map(c=>`<i style="width:${c.balance/owed*100}%;background:${c.color}"></i>`).join('')}</div>
      ${cards.map(c=>`<div class="kv" data-card="${c.id}" style="cursor:pointer;align-items:center"><span><span class="dot" style="display:inline-grid;width:12px;height:12px;border-radius:50%;background:${c.color};vertical-align:middle;margin-right:8px;box-shadow:none"></span>${esc(c.name)}</span><span class="num"><b>${fmt(c.balance)}</b> <span class="muted small">${(c.balance/owed*100).toFixed(0)}%</span></span></div>`).join('')||'<div class="empty">Nothing owed.</div>'}
    </div>
    <div class="card"><div class="muted small">${MONTHS[new Date().getMonth()]} expenses by category</div>
      ${cats.map(([c,v])=>`<div class="kv"><span>${esc(c)}</span><span class="num"><b>${fmt(v)}</b> <span class="muted small">${(v/spent*100).toFixed(0)}%</span></span></div>`).join('')||'<div class="empty">No expenses yet this month.</div>'}
      ${spent?`<div class="kv"><span class="muted">Total spent</span><span class="num"><b>${fmt(spent)}</b></span></div>`:''}
    </div>
    <div class="card">
      <div class="kv"><span class="muted">Card payments this month</span><span class="num">${fmt(pays)}</span></div>
      <div class="kv"><span class="muted">Fixed installments per month</span><span class="num">${fmt(inst)}</span></div>
    </div>
    <div class="actions"><button id="bClose" class="btn-primary">Close</button></div>`,
  r=>{ r.querySelector('#bClose').onclick=closeSheet;
    r.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{ const c=S.cards.find(x=>x.id===el.dataset.card); c&&cardDetail(c); }); });
}

function txnList(list){
  if(!list.length) return `<div class="list"><div class="empty">Nothing yet. Tap + to add an expense.</div></div>`;
  return `<div class="list">${list.map(t=>{
    const card = S.cards.find(c=>c.id===t.cardId);
    const isPay = t.type==='payment';
    return `<div class="item" data-txn="${t.id}">
      <div class="dot" style="background:${isPay?'var(--ok)':(card?card.color:'#8a8f98')}">${isPay?'✓':esc(initials(t.cat||'?'))}</div>
      <div class="grow"><div class="title">${esc(isPay?'Payment to '+(card?card.name:'card'):(t.note||t.cat))}</div>
        <div class="small muted">${dshort(parseISO(t.date))} · ${isPay?'Card payment':esc(t.cat)+' · '+esc(card?card.name:'Cash / debit')}</div></div>
      <div class="num" style="font-weight:600">${isPay?'':'−'}${fmt(t.amount)}</div>
    </div>`;}).join('')}</div>`;
}

function vCards(){
  if(!S.cards.length) return `<div class="list"><div class="empty">No cards yet. Tap + to add one.</div></div>`;
  const sorted = S.cards.slice().sort((a,b)=>(nextDue(a)||9e15)-(nextDue(b)||9e15));
  return `<div class="list">${sorted.map(c=>{
    const st=dueStatus(c); const u = c.limit? c.balance/c.limit*100 : null;
    return `<div class="item" data-card="${c.id}" style="flex-wrap:wrap">
      <div class="dot" style="background:${c.color}">${esc(initials(c.name))}</div>
      <div class="grow"><div class="title">${esc(c.name)}</div>
        <div class="small muted">${c.dueDay?'Due on the '+ord(c.dueDay):'No due day'}${c.statementDay?' · statement '+ord(c.statementDay):''}</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:700">${fmt(c.balance)}</div><span class="pill ${st.cls}">${st.label}</span></div>
      ${u!==null?`<div style="flex-basis:100%;padding-left:48px"><div class="bar ${u>70?'danger':u>40?'warn':''}" style="margin-top:2px"><i style="width:${Math.min(u,100)}%"></i></div></div>`:''}
    </div>`;}).join('')}</div>
    <div class="hint">Tap a card to record a payment, edit it, or add its due date to your iPhone Calendar.</div>`;
}
const ord = n => n + (n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');

function monthSeg(){
  return `<div class="seg"><button data-mon="-1" aria-label="Previous month">‹</button>
    <div class="lbl">${MONTHS[viewMonth.getMonth()]} ${viewMonth.getFullYear()}</div>
    <button data-mon="1" aria-label="Next month">›</button></div>`;
}
function vSpend(){
  const mk = monthKey(viewMonth);
  const list = S.txns.filter(t=>t.date.slice(0,7)===mk).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  const spent = list.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
  const paid = list.filter(t=>t.type==='payment').reduce((a,t)=>a+t.amount,0);
  return `${monthSeg()}

}

function vBudget(){
  const mk = monthKey(viewMonth);
  const tx = monthTxns(mk);
  const byCat = {}; tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const total = S.budgets.reduce((a,b)=>a+(+b.amount||0),0);
  const spent = tx.reduce((a,t)=>a+t.amount,0);
  const budgetCats = new Set(S.budgets.map(b=>b.cat));

  const installments = S.cards.filter(c=>c.payMode==='installment' && c.installment>0);

  const savings = (+S.income||0) - total - instTotal;
  return `${monthSeg()}
  <div class="card" style="margin-top:8px">
    <div class="kv"><span class="muted">Monthly income</span><span class="num">${fmt(S.income)}</span></div>

    <div class="kv"><span class="muted">Card installments</span><span class="num">${fmt(instTotal)}</span></div>
    <div class="kv"><span style="font-weight:600">Planned savings</span><span class="num" style="font-weight:700;color:${savings<0?'var(--danger)':'var(--ok)'}">${fmt(savings)}</span></div>
    <div class="kv"><span class="muted">Actually spent so far</span><span class="num">${fmt(spent)}</span></div>
  </div>
  <h2>Monthly plan</h2>

    const s = byCat[b.cat]||0; const pct = b.amount? s/b.amount*100 : (s?100:0);
    return `<div class="item" data-budget="${b.id}" style="flex-wrap:wrap">
      <div class="grow"><div class="title">${esc(b.name)}</div><div class="small muted">${esc(b.cat)}${b.day?' · on the '+ord(b.day):''}</div></div>

      <div style="flex-basis:100%"><div class="bar ${pct>100?'danger':pct>85?'warn':''}"><i style="width:${Math.min(pct,100)}%"></i></div></div>

  ${other.length?`<h2>Outside the plan</h2><div class="list">${other.map(([c,v])=>`<div class="item"><div class="grow title">${esc(c)}</div><div class="num">${fmt(v)}</div></div>`).join('')}</div>`:''}

// ---------- calendar / backup ----------
function downloadIcs(cards, filename){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CardTrack//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  cards.filter(c=>c.dueDay).forEach(c=>{
    const d = nextDue(c); const ds = iso(d).replace(/-/g,''); const de = iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)).replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:cardtrack-${c.id}@local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${de}`,
      // Days above 28 fall back to the last day of short months
      c.dueDay>28 ? `RRULE:FREQ=MONTHLY;BYMONTHDAY=${c.dueDay},-1;BYSETPOS=1` : `RRULE:FREQ=MONTHLY;BYMONTHDAY=${c.dueDay}`,
      `SUMMARY:${icsEsc(c.name)} card payment due`,`DESCRIPTION:${icsEsc(payModeText(c))}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(c.name)} due in 3 days`,'TRIGGER:-P2DT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(c.name)} due today`,'TRIGGER:PT9H','END:VALARM',
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  saveFile(lines.join('\r\n'), filename, 'text/calendar');
}
const icsEsc = s => String(s).replace(/[\\;,]/g,m=>'\\'+m);
function saveFile(text, filename, type){
  const blob=new Blob([text],{type});
  const file = new File([blob], filename, {type});
  if(navigator.canShare && navigator.canShare({files:[file]}) && type!=='text/calendar'){
    navigator.share({files:[file],title:filename}).catch(()=>{});
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function exportCsv(){
  const rows=[['Date','Type','Category','Card','Amount (AED)','Note']];
  S.txns.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    const c=S.cards.find(c=>c.id===t.cardId);
    rows.push([t.date,t.type,t.cat||'',c?c.name:'Cash / debit',t.amount,t.note||'']);
  });
  saveFile(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),`cardtrack-${iso(today())}.csv`,'text/csv');
}

// Backup codes: base64url JSON, also accepted as a link ending in #d=<code>
function encodeBackup(d){
  const bytes=new TextEncoder().encode(JSON.stringify(d)); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeBackup(text){
  text=String(text).trim();
  if(text.startsWith('{')) return JSON.parse(text);
  const code=text.includes('#d=') ? text.split('#d=')[1] : text;
  const bin=atob(code.replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/'));
  const d=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
  if(!Array.isArray(d.cards)||!Array.isArray(d.txns)) throw 0;
  return d;
}
function copyText(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'))
    .catch(()=>openSheet(`<h3>Backup code</h3><label class="field"><textarea rows="6" readonly>${esc(t)}</textarea></label><div class="hint">Select all and copy.</div><div class="actions"><button id="xClose">Close</button></div>`,r=>r.querySelector('#xClose').onclick=closeSheet));
}
function restore(d){ S=d; S.cards||=[]; S.budgets||=[]; S.txns||=[]; save(); render(); toast('Data loaded'); }
function pasteForm(){
  openSheet(`<h3>Paste backup code</h3>
    <label class="field"><textarea id="pText" rows="6" placeholder="Paste the code or link here"></textarea></label>
    <div class="hint">Tap <b>Paste from clipboard</b>, or press and hold in the box and choose Paste.</div>
    <div class="actions"><button id="pClip">Paste from clipboard</button></div>
    <div class="actions"><button id="pCancel">Cancel</button><button class="btn-primary" id="pGo">Load data</button></div>`,
  root=>{ root.querySelector('#pCancel').onclick=closeSheet;
    root.querySelector('#pClip').onclick=()=>{ (navigator.clipboard?navigator.clipboard.readText():Promise.reject())
      .then(t=>{ root.querySelector('#pText').value=t; if(!t.trim()) toast('Clipboard is empty'); }).catch(()=>toast('Press and hold in the box, then tap Paste')); };
    root.querySelector('#pGo').onclick=()=>{ const raw=root.querySelector('#pText').value; if(!raw.trim()){ toast('Paste the code first'); return; }
      let d; try{ d=decodeBackup(raw); }catch(e){ toast('That code is not valid'); return; }
      if((S.cards.length||S.txns.length) && !confirm('Replace everything on this phone?')) return;
      closeSheet(); restore(d); }; });
}
function importFromLink(){
  if(!location.hash.startsWith('#d=')) return;
  const code=location.hash.slice(3); history.replaceState(null,'',location.pathname);
  let d; try{ d=decodeBackup(code); }catch(e){ toast('That link is not valid'); return; }
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  openSheet(`<h3>Load your data</h3>
    <div class="hint">${d.cards.length} cards, ${d.budgets.length} budget lines, ${d.txns.length} expenses.</div>
    ${standalone?'':`<div class="hint">The Home Screen app keeps its own data. If you already added CardTrack to your Home Screen, tap <b>Copy code</b>, open CardTrack from the Home Screen, go to <b>More → Paste backup code</b>, and paste.</div>`}
    ${standalone?'':`<label class="field"><span>Your code</span><textarea id="lCode" rows="3" readonly>${esc(code)}</textarea></label>`}
    <div class="actions">${standalone?'':'<button id="lCopy">Copy code</button>'}<button class="btn-primary" id="lLoad">Load here</button></div>
    <div class="actions"><button id="lCancel">Cancel</button></div>`,
  root=>{ root.querySelector('#lCancel').onclick=closeSheet;
    root.querySelector('#lCopy')?.addEventListener('click',()=>{ const t=root.querySelector('#lCode'); t.focus(); t.select(); t.setSelectionRange(0,t.value.length); copyText(code); });
    root.querySelector('#lLoad').onclick=()=>{ if((S.cards.length||S.txns.length) && !confirm('Replace everything on this phone?')) return; closeSheet(); restore(d); }; });
}

load(); render(); importFromLink();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
