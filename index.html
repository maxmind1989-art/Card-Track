<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CardTrack">
<meta name="theme-color" content="#eaf6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1d1b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>CardTrack</title>
<style>
:root{
  --bg:#eaf6f3;--bg2:#e6efff;--grad:linear-gradient(135deg,#0fa86f 0%,#1c6fe0 100%);--surface:#fff;--surface2:#eef0f3;--text:#14161a;--muted:#6b7280;--line:#e3e6ea;
  --accent:#0b8a6a;--accent-ink:#fff;--danger:#c0362c;--warn:#b86e00;--ok:#0a7d5a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b1d1b;--bg2:#0b1a30;--grad:linear-gradient(135deg,#12a672 0%,#2b6fe0 100%);--surface:#1a1c20;--surface2:#24272c;--text:#eef0f3;--muted:#9aa1ab;--line:#2c3036;
    --accent:#2fbf8c;--accent-ink:#06261b;--danger:#ff6b5e;--warn:#f0a83a;--ok:#2fbf8c;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg) linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh}
body.bud{padding-top:0}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:28px;margin:0;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 16px 8px;font-weight:600}
main{max-width:640px;margin:0 auto}
.card{background:var(--surface);border-radius:14px;margin:0 16px 10px;padding:14px 16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 10px}
.stats .card{margin:0}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:3px}
.bar.warn>i{background:var(--warn)}.bar.danger>i{background:var(--danger)}
.list{background:var(--surface);border-radius:14px;margin:0 16px 10px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{box-shadow:0 2px 6px rgba(0,0,0,.15);width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.bband{background:linear-gradient(135deg,#12b07a 0%,#1c8fd0 55%,#2b6fe0 100%);padding:calc(env(safe-area-inset-top) + 16px) 16px 74px;border-radius:0 0 28px 28px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bband .lbl{font-size:16px;opacity:.9}.bband .amt{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bband .right{display:flex;align-items:center;gap:8px}
.mpill{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.bplus{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.25);color:#fff;font-size:24px;line-height:38px;padding:0}
.tiles{margin:-54px 16px 0;background:var(--surface);border-radius:24px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;box-shadow:0 6px 24px rgba(28,111,224,.15);position:relative}
.tile{background:var(--surface2);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.tile .t{font-size:12.5px;color:var(--muted);line-height:1.2}.tile .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .grow{flex:1;min-width:0}.tile .chev2{display:none}
.ic{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center}
.ic svg{width:22px;height:22px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.plan-h{display:flex;align-items:center;justify-content:space-between;margin:22px 16px 10px}
.plan-h h2{margin:0}.tot{background:rgba(28,111,224,.12);color:#1c6fe0;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px #1c6fe0,0 6px 20px rgba(28,111,224,.45)}100%{box-shadow:var(--shadow)}}
.bitem{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;margin:0 16px 10px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.bitem .grow{flex:1;min-width:0}
.bitem .pct{font-size:13px;color:var(--muted);width:36px;text-align:right}
.bitem .barrow{display:flex;align-items:center;gap:8px;margin-top:6px}.bitem .barrow .bar{flex:1;margin:0}
.bitem .chev2{color:var(--muted);font-size:20px}
.scan{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(28,111,224,.45);z-index:6;padding:0;display:grid;place-items:center}
.scan svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prog{height:8px;border-radius:4px;background:var(--surface2);margin:0 16px 12px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
.thumb{display:block;max-height:140px;max-width:calc(100% - 32px);margin:0 16px 12px;border-radius:12px;box-shadow:var(--shadow)}
.slides{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:4px 16px 14px;margin:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 74%;max-width:290px;scroll-snap-align:start;border-radius:22px;padding:16px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:170px}
.slide .row{align-items:flex-start}
.hrow.sel{background:rgba(28,111,224,.1);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px}
.slide.sm{flex:0 0 150px;min-height:110px;padding:12px}
.sbadge{background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.samt{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.sline{font-size:13px;opacity:.85}
.sfoot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sdays{font-size:20px;font-weight:800}.sdays.hot{background:rgba(255,255,255,.95);color:#c0362c;border-radius:999px;padding:2px 12px;font-size:17px}
.sdue{font-size:13px;opacity:.9;white-space:nowrap}
.hero{background:var(--grad);color:#fff;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(28,111,224,.3)}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .bar{background:rgba(255,255,255,.28)}
.hero .bar>i{background:#fff}
.hero .chev{position:absolute;right:16px;top:14px;font-size:13px;font-weight:600;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px}
.seg2{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 12px}
.seg2 i{display:block;height:100%}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.danger{color:var(--danger)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--surface2);color:var(--text);font-weight:600;cursor:pointer}
.btn-primary{background:var(--grad);color:#fff}
.btn-danger{background:transparent;color:var(--danger)}
.btn-round{width:40px;height:40px;padding:0;border-radius:50%;background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(28,111,224,.35);font-size:24px;line-height:40px}
.seg{display:flex;align-items:center;gap:8px;margin:4px 16px 4px}
.seg button{padding:8px 12px}
.seg .lbl{flex:1;text-align:center;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid transparent;border-image:var(--grad) 1;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px}
nav button.on{color:#1c6fe0}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg) linear-gradient(160deg,var(--bg),var(--bg2));width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 0 calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 16px 12px;font-size:20px}
.field{display:block;margin:0 16px 12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
input[type=checkbox]{appearance:auto;-webkit-appearance:checkbox;width:22px;height:22px;padding:0;flex:none;accent-color:#1c6fe0}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);appearance:none;-webkit-appearance:none}
input[type=date]{min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.grid2 .field:first-child{margin-right:6px}.grid2 .field:last-child{margin-left:6px}
.actions{display:flex;gap:10px;margin:16px 16px 0}
.actions button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 12px}
.chips button{padding:7px 12px;font-size:14px;border-radius:999px}
.chips button.on{background:var(--grad);color:#fff}
.hint{margin:0 16px 12px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1 id="title">Overview</h1><button class="btn-round" id="addBtn" aria-label="Add">+</button></header>
  <section id="view"></section>
</main>

<nav id="nav">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Overview</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Cards</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Expenses</button>
  <button data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Budget</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
</nav>

<button class="scan" id="scanBtn" aria-label="Scan a bill screenshot"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg></button>
<input type="file" id="scanFile" accept="image/*" multiple hidden>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'cardtrack.v1';
const COLORS = ['#0a7d5a','#1f5fbf','#a13d8f','#c0572c','#6b4fd8','#00808a','#b8860b','#c0362c','#4a5568'];
const CATS = ['Food','Groceries','Fuel','Rent','Back home','Bills','Water','Electricity','Gas','Phone','Internet','Home internet','Transport','Shopping','Health','Dining out','Entertainment','Other'];

const totalIncome = () => (+S.income||0) + (+S.reimb||0);
function seed(){ return {version:1, income:0, cards:[], budgets:[], txns:[]}; }

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); }
  catch(e){ S = seed(); }
  S.cards ||= []; S.budgets ||= []; S.txns ||= [];
  if(!S.m2){ // one-time: electricity and gas bills with bill/due dates
    S.budgets.forEach(b=>{ if(b.name==='Water bill' && b.cat==='Bills') b.cat='Water'; });
    if(S.budgets.length){
      if(!S.budgets.some(b=>b.cat==='Electricity')) S.budgets.push({id:uid(),name:'DEWA electricity bill',amount:0,cat:'Electricity',day:null,billDay:null,dueDay:null});
      if(!S.budgets.some(b=>b.cat==='Gas')) S.budgets.push({id:uid(),name:'Gas bill',amount:0,cat:'Gas',day:null,billDay:null,dueDay:null});
    }
    S.m2=1;
  }
  if(!S.m3){ // bill and due days -> full dates
    S.budgets.forEach(b=>{
      if(b.dueDay && !b.dueDate){
        const due=nextDue({dueDay:b.dueDay}); b.dueDate=iso(due);
        if(b.billDay){ let bd=onDay(due.getFullYear(),due.getMonth(),b.billDay); if(bd>due) bd=onDay(due.getFullYear(),due.getMonth()-1,b.billDay); b.billDate=iso(bd); }
      }
    });
    S.m3=1;
  }
  if(!S.m4){ // separate home internet bill
    if(S.budgets.length && !S.budgets.some(b=>/home\s*internet/i.test(b.name))) S.budgets.push({id:uid(),name:'Home internet bill',amount:0,cat:'Home internet',day:null,billDate:null,dueDate:null,billDay:null,dueDay:null});
    S.m4=1;
  }
  if(!S.m6){ // food is tracked by monthly entries too
    S.budgets.forEach(b=>{ if(b.cat==='Food'){ b.tracker=true; b.billDate=b.dueDate=null; b.billDay=b.dueDay=null; } });
    S.m6=1;
  }
  if(!S.m5){ // fuel is tracked by monthly entries, not bill dates
    S.budgets.forEach(b=>{ if(b.cat==='Fuel'){ b.tracker=true; b.billDate=b.dueDate=null; b.billDay=b.dueDay=null; } });
    S.m5=1;
  }
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save'); } }

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = n => { n=Number(n)||0; return 'AED ' + n.toLocaleString('en-AE',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2}); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const monthKey = d => iso(d).slice(0,7);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dshort = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const dfull = d => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const dim = (y,m) => new Date(y,m+1,0).getDate();
const onDay = (y,m,day) => new Date(y,m,Math.min(day,dim(y,m)));
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
const daysBetween = (a,b) => Math.round((b-a)/86400000);
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// Next due date on or after today for a card
function nextDue(card, from=today()){
  if(card.dueDate){ const d0=parseISO(card.dueDate); let k=0; while(onDay(d0.getFullYear(),d0.getMonth()+k,d0.getDate())<from) k++; return onDay(d0.getFullYear(),d0.getMonth()+k,d0.getDate()); }
  if(!card.dueDay) return null;
  let d = onDay(from.getFullYear(), from.getMonth(), card.dueDay);
  if(d < from) d = onDay(from.getFullYear(), from.getMonth()+1, card.dueDay);
  return d;
}
// The statement date that starts the cycle for a given due date
function cycleStart(card, due){
  if(card.statementDate&&card.dueDate){ const s0=parseISO(card.statementDate), d0=parseISO(card.dueDate), k=(due.getFullYear()-d0.getFullYear())*12+(due.getMonth()-d0.getMonth()); return onDay(s0.getFullYear(),s0.getMonth()+k,s0.getDate()); }
  if(card.statementDay){
    let s = onDay(due.getFullYear(), due.getMonth(), card.statementDay);
    if(s >= due) s = onDay(due.getFullYear(), due.getMonth()-1, card.statementDay);
    return s;
  }
  const s = onDay(due.getFullYear(), due.getMonth()-1, due.getDate());
  s.setDate(s.getDate()+1);
  return s;
}
function paidThisCycle(card){
  const due = nextDue(card); if(!due) return 0;
  const start = cycleStart(card, due);
  return S.txns.filter(t=>t.type==='payment' && t.cardId===card.id && parseISO(t.date)>=start && parseISO(t.date)<=due)
               .reduce((a,t)=>a+t.amount,0);
}
function dueStatus(card){
  const due = nextDue(card);
  if(!due) return {label:'No due date',cls:''};
  if(card.balance<=0) return {label:'Nothing owed',cls:'ok',due};
  const paid = paidThisCycle(card);
  if(paid>0) return {label:'Paid '+fmt(paid),cls:'ok',due,paid};
  const n = daysBetween(today(), due);
  const label = n===0 ? 'Due today' : n===1 ? 'Due tomorrow' : `Due in ${n} days`;
  return {label, cls: n<=3 ? 'danger' : n<=7 ? 'warn' : '', due, days:n};
}
function payModeText(c){
  if(c.payMode==='bill') return 'Bill payment';
  if(c.payMode==='installment') return `Installment ${fmt(c.installment)}/mo`;
  if(c.payMode==='min') return 'Paying minimum';
  return 'Pay in full';
}
function monthTxns(mk, type='expense'){ return S.txns.filter(t=>t.type===type && t.date.slice(0,7)===mk); }

// ---------- views ----------
let tab='home', viewMonth=new Date(); viewMonth.setDate(1);

const ICONS={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 fork:'<path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',
 fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3M6 8h6"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/>',

  const spent = monthTxns(mk).reduce((a,t)=>a+t.amount,0);
  const cardPays = monthTxns(mk,'payment').reduce((a,t)=>a+t.amount,0);
  const budget = S.budgets.reduce((a,b)=>a+(+b.amount||0),0);
  const plannedCard = S.cards.reduce((a,c)=>a+(c.payMode==='installment'?(+c.installment||0):0),0);
  const out = spent + cardPays;
  const left = totalIncome() - out;
  const util = limit ? owed/limit*100 : 0;
  const upcoming = S.cards.map(c=>({c,st:dueStatus(c)})).filter(x=>x.st.due && x.c.balance>0)
    .sort((a,b)=>a.st.due-b.st.due).slice(0,5);

  <div class="card hero" id="heroOwed" role="button">

    <div class="row small muted" style="margin-top:6px"><span>${util.toFixed(0)}% of ${fmt(limit)} limits used</span><span>${S.cards.length} cards</span></div>`:''}
  </div>
  <h2 style="margin-top:6px">This month, by card</h2>

    const st=dueStatus(c), amt=+c.stmtAmount||+c.balance||0, paid=!!st.paid&&c.balance>0||c.balance<=0&&!c.stmtAmount;
    const n=st.due?daysBetween(today(),st.due):null;

    const badge=c.balance<=0?'Nothing owed':st.paid?'Paid':'';

  const inst=cards.filter(c=>c.payMode==='installment'&&c.installment>0).reduce((a,c)=>a+c.installment,0);
  openSheet(`<h3>Total owed ${fmt(owed)}</h3>

const ord = n => n + (n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');

function billCycle(b){
  if(!b.dueDate) return null;
  const d0=parseISO(b.dueDate), b0=b.billDate?parseISO(b.billDate):null; let k=0;
  while(onDay(d0.getFullYear(),d0.getMonth()+k,d0.getDate())<today()) k++;
  return {due:onDay(d0.getFullYear(),d0.getMonth()+k,d0.getDate()), bill:b0?onDay(b0.getFullYear(),b0.getMonth()+k,b0.getDate()):null};
}
function vBudget(){
  const mk = monthKey(viewMonth);
  const tx = monthTxns(mk);
  const byCat = {}; tx.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const total = S.budgets.reduce((a,b)=>a+(+b.amount||0),0);
  const spent = tx.reduce((a,t)=>a+t.amount,0);
  const budgetCats = new Set(S.budgets.map(b=>b.cat));
  const other = Object.entries(byCat).filter(([c])=>!budgetCats.has(c));
  const instTotal = S.cards.filter(c=>c.payMode==='installment').reduce((a,c)=>a+(+c.installment||0),0);
  const savings = totalIncome() - total - instTotal;
  const tile=(id,icon,col,label,val,color)=>`<div class="tile" data-tile="${id}">${ic(icon,col)}<div class="grow"><div class="t">${label}</div><div class="v"${color?` style="color:${color}"`:''}>${fmt(val)}</div></div><span class="chev2">›</span></div>`;
  return `<div class="bband"><div><div class="lbl">Monthly Income</div><div class="amt" data-tile="income">${fmt(totalIncome())}</div>${+S.reimb?`<div class="lbl" style="font-size:13px;margin-top:2px">incl. reimbursement ${fmt(S.reimb)}</div>`:''}</div>
    <div class="right"><button class="mpill" id="monBtn">${MONTHS[viewMonth.getMonth()]} ${viewMonth.getFullYear()} ▾</button><button class="bplus" id="bAdd" aria-label="Add budget line">+</button></div></div>
  <div class="tiles">
    ${tile('plan','wallet','#2563eb','Planned Expenses',total)}
    ${tile('inst','card','#7c4dde','Card Installments',instTotal)}
    ${tile('save','piggy','#0f9d6a','Planned Savings',savings,savings<0?'var(--danger)':'var(--ok)')}
    ${tile('spent','bars','#e8862a','Actually Spent So Far',spent)}
  </div>
  <div class="plan-h" id="planTop"><h2>Monthly plan</h2><span class="tot">Total Planned: <b>${fmt(total)}</b></span></div>
  ${S.budgets.map(b=>{
    const s = byCat[b.cat]||0; const pct = b.amount? s/b.amount*100 : (s?100:0);
    const bits=[b.cat];
    if(b.day) bits.push('on the '+ord(b.day));
    const cy=b.tracker?null:billCycle(b);
    if(b.tracker){ const k=tx.filter(t=>t.cat===b.cat).length; bits.push(k?`${k} ${k===1?'entry':'entries'} in ${MONTHS[viewMonth.getMonth()]}`:'Tap to see monthly history'); }
    if(cy){ if(cy.bill) bits.push('Bill date '+dfull(cy.bill)); const n=daysBetween(today(),cy.due); bits.push('Due '+dfull(cy.due)+(n<=7?` (${n===0?'today':n===1?'tomorrow':'in '+n+' days'})`:'')); }
    return `<div class="bitem" data-budget="${b.id}">${catIc(b.cat)}
      <div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0"><div class="title" style="font-weight:700;font-size:17px">${esc(b.name)}</div><div class="small muted" style="white-space:normal">${esc(bits.join(' · '))}</div></div>
        <div class="num" style="text-align:right">${b.dueDate?`<b style="font-size:18px">${fmt(b.amount)}</b><div class="small muted">Spent ${fmt(s)}</div>`:`<b style="font-size:17px">${fmt(s)}</b><div class="small muted">of <b style="color:var(--text)">${fmt(b.amount)}</b></div>`}</div></div>
        <div class="barrow"><div class="bar ${pct>100?'danger':pct>85?'warn':''}"><i style="width:${Math.min(pct,100)}%"></i></div><span class="pct">${Math.round(pct)}%</span></div></div>
      <span class="chev2">›</span></div>`;}).join('') || '<div class="list"><div class="empty">No budget lines yet. Tap + to add one.</div></div>'}
  ${other.length?`<h2>Outside the plan</h2><div class="list">${other.map(([c,v])=>`<div class="item">${catIc(c)}<div class="grow title">${esc(c)}</div><div class="num">${fmt(v)}</div></div>`).join('')}</div>`:''}
  <div class="hint">Tap a line to change it, including its bill date and due date.</div>`;
}

// ---------- sheets / forms ----------
function openSheet(html, onMount){ $('#sheet').innerHTML=html; $('#sheetBg').classList.add('open'); onMount && onMount($('#sheet')); }
function closeSheet(){ $('#sheetBg').classList.remove('open'); $('#sheet').innerHTML=''; }
$('#sheetBg').addEventListener('click',e=>{ if(e.target.id==='sheetBg') closeSheet(); });
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n)? Math.round(n*100)/100 : 0; };
const dayOrNull = v => { const n=parseInt(v,10); return n>=1&&n<=31?n:null; };

function expenseForm(t){
  const isNew=!t; t = t || {date:iso(today()),cat:'Food',cardId:'',amount:'',note:''};
  openSheet(`<h3>${isNew?'Add expense':'Edit expense'}</h3>
    <label class="field"><span>Amount (AED)</span><input id="fAmt" inputmode="decimal" value="${t.amount||''}" placeholder="0" autocomplete="off"></label>
    <div class="chips" id="fCats">${CATS.map(c=>`<button type="button" class="${c===t.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="field"><span>Paid with</span><select id="fCard"><option value="">Cash / debit card</option>${S.cards.map(c=>`<option value="${c.id}" ${c.id===t.cardId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="field"><span>Date</span><input type="date" id="fDate" value="${t.date}"></label>
    <label class="field"><span>Note</span><input id="fNote" value="${esc(t.note)}" placeholder="Optional"></label></div>
    <div class="hint">Expenses on a credit card are added to that card's balance.</div>
    <div class="actions">${isNew?'':'<button class="btn-danger" id="fDel">Delete</button>'}<button id="fCancel">Cancel</button><button class="btn-primary" id="fSave">Save</button></div>`,
  root=>{
    let cat=t.cat;
    root.querySelector('#fCats').onclick=e=>{const b=e.target.closest('button'); if(!b)return; cat=b.dataset.c; root.querySelectorAll('#fCats button').forEach(x=>x.classList.toggle('on',x===b));};
    root.querySelector('#fCancel').onclick=closeSheet;
    if(!isNew) root.querySelector('#fDel').onclick=()=>{ if(confirm('Delete this expense?')){ applyTxn(t,-1); S.txns=S.txns.filter(x=>x.id!==t.id); save(); closeSheet(); render(); toast('Deleted'); } };
    root.querySelector('#fSave').onclick=()=>{
      const amount=num(root.querySelector('#fAmt').value); if(amount<=0){toast('Enter an amount');return;}
      const nt={...t,id:t.id||uid(),ts:t.ts||Date.now(),type:'expense',amount,cat,cardId:root.querySelector('#fCard').value||null,date:root.querySelector('#fDate').value||iso(today()),note:root.querySelector('#fNote').value.trim()};
      if(!isNew){ applyTxn(t,-1); S.txns=S.txns.filter(x=>x.id!==t.id); }
      applyTxn(nt,1); S.txns.push(nt); save(); closeSheet(); render(); toast('Saved');
    };
    if(isNew) setTimeout(()=>root.querySelector('#fAmt').focus(),250);
  });
}
// Keep card balances in step with expenses (+) and payments (−)
function applyTxn(t, sign){
  const c=S.cards.find(c=>c.id===t.cardId); if(!c) return;
  const delta = t.type==='payment' ? -t.amount : t.amount;
  c.balance = Math.round(((+c.balance||0) + sign*delta)*100)/100;
}

function paymentForm(card, t){
  const isNew=!t; t=t||{date:iso(today()),amount:card.payMode==='installment'&&card.installment?card.installment:'',note:''};
  openSheet(`<h3>${isNew?'Pay '+esc(card.name):'Edit payment'}</h3>

function entriesSlides(cat,mk=monthKey(viewMonth)){

  return `<div id="entBox"><div class="plan-h" style="margin:6px 16px 6px"><h2 style="margin:0">${MONTHS[md.getMonth()]} ${md.getFullYear()} entries</h2><span class="tot">${fmt(total)}</span></div>
  ${list.length?`<div class="slides">${list.map(t=>{ const c=S.cards.find(x=>x.id===t.cardId); return `<div class="slide sm" data-ent="${t.id}" style="background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(0,0,0,.2)),${(CAT_ICON[cat]||[0,'#e8662a'])[1]}">
    <div class="sdue" style="font-size:14px;font-weight:700">${dfull(parseISO(t.date))}</div>
    <div class="samt num" style="font-size:24px;margin-top:6px">${fmt(t.amount)}</div>
    <div class="sline">${esc(c?c.name:'Cash / debit')}</div></div>`; }).join('')}</div>`:'<div class="hint">No entries this month yet. Scan a receipt to add one.</div>'}</div>`;
}
// spending per month for one category, newest first
function histHtml(cat,sel=monthKey(viewMonth)){
  const by={}; S.txns.filter(t=>t.type==='expense'&&t.cat===cat).forEach(t=>{ const k=t.date.slice(0,7); (by[k]||={sum:0,n:0}); by[k].sum+=t.amount; by[k].n++; });
  if(!by[sel]) by[sel]={sum:0,n:0};
  const keys=Object.keys(by).sort().reverse(); const years={}; keys.forEach(k=>{ const y=k.slice(0,4); years[y]=(years[y]||0)+by[k].sum; });
  let out='', lastY='';
  keys.forEach(k=>{ const y=k.slice(0,4);
    if(y!==lastY){ out+=`<div class="kv" style="border-top:0;padding-top:${lastY?'12px':'0'}"><b>${y} total</b><span class="num"><b>${fmt(years[y])}</b></span></div>`; lastY=y; }
    out+=`<div class="kv hrow${k===sel?' sel':''}" data-hist="${k}" style="cursor:pointer"><span>${MONTHS[+k.slice(5)-1]} ${y} <span class="muted small">· ${by[k].n} ${by[k].n===1?'entry':'entries'}</span></span><span class="num"><b>${fmt(by[k].sum)}</b></span></div>`; });
  return `<div class="card" id="histBox" style="margin:4px 16px 12px"><div class="muted small" style="margin-bottom:6px">Spent on ${esc(cat)} by month · tap a month to see its entries</div>${out}</div>`;
}

// ---------- calendar / backup ----------
function downloadIcs(cards, filename, bills=[]){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CardTrack//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  cards.concat(bills.filter(b=>b.dueDay).map(b=>({id:b.id,name:b.name,dueDay:b.dueDay,payMode:'bill'}))).filter(c=>c.dueDay).forEach(c=>{
    const d = nextDue(c); const ds = iso(d).replace(/-/g,''); const de = iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)).replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:cardtrack-${c.id}@local`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ds}`,`DTEND;VALUE=DATE:${de}`,
      // Days above 28 fall back to the last day of short months
      c.dueDay>28 ? `RRULE:FREQ=MONTHLY;BYMONTHDAY=${c.dueDay},-1;BYSETPOS=1` : `RRULE:FREQ=MONTHLY;BYMONTHDAY=${c.dueDay}`,
      `SUMMARY:${icsEsc(c.name)} ${c.payMode==='bill'?'':'card payment '}due`,`DESCRIPTION:${icsEsc(payModeText(c))}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(c.name)} due in 3 days`,'TRIGGER:-P2DT15H','END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(c.name)} due today`,'TRIGGER:PT9H','END:VALARM',
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  saveFile(lines.join('\r\n'), filename, 'text/calendar');
}
const icsEsc = s => String(s).replace(/[\\;,]/g,m=>'\\'+m);
function saveFile(text, filename, type){
  const blob=new Blob([text],{type});
  const file = new File([blob], filename, {type});
  if(navigator.canShare && navigator.canShare({files:[file]}) && type!=='text/calendar'){
    navigator.share({files:[file],title:filename}).catch(()=>{});
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
}
function exportCsv(){
  const rows=[['Date','Type','Category','Card','Amount (AED)','Note']];
  S.txns.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    const c=S.cards.find(c=>c.id===t.cardId);
    rows.push([t.date,t.type,t.cat||'',c?c.name:'Cash / debit',t.amount,t.note||'']);
  });
  saveFile(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),`cardtrack-${iso(today())}.csv`,'text/csv');
}

      <optgroup label="Bills">${S.budgets.map(b=>opt('bill:'+b.id,b.name)).join('')}</optgroup>
      <optgroup label="Cards">${S.cards.map(c=>opt('card:'+c.id,c.name)).join('')}</optgroup></select></label>
    <label class="field"><span>Amount (AED)</span><input id="scAmt" inputmode="decimal" value="${pr.amount??''}" style="font-weight:700"></label>
    <div class="grid2" id="scDates"><label class="field"><span>Bill date</span><input type="date" id="scBill" value="${pr.bill?iso(pr.bill):''}"></label>
    <label class="field"><span>Due date</span><input type="date" id="scDue" value="${pr.due?iso(pr.due):''}"></label></div>
    <div id="scTrack" hidden><div class="grid2"><label class="field"><span>Date</span><input type="date" id="scTDate" value="${iso(pr.due||pr.bill||today())}"></label>
    <label class="field"><span>Paid with</span><select id="scPay"><option value="">Cash / debit</option>${S.cards.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div></div>
    <div class="hint" id="scNote"></div>
    ${pr.text?`<details class="hint"><summary>Text I read from the screenshot</summary><pre style="white-space:pre-wrap;font-size:12px;max-height:160px;overflow:auto">${esc(pr.text)}</pre></details>`:''}
    <div class="actions"><button id="scCancel">${multi?(lastOne?'Skip':'Skip'):'Cancel'}</button><button class="btn-primary" id="scAdd">${multi&&!lastOne?'Add & next':'Add'}</button></div>`,
  r=>{
    const isTrack=v=>{ const b=v.startsWith('bill:')&&S.budgets.find(x=>x.id===v.slice(5)); return !!(b&&b.tracker); };
    const note=()=>{ const v=r.querySelector('#scTarget').value; const tr=isTrack(v); r.querySelector('#scDates').hidden=tr; r.querySelector('#scTrack').hidden=!tr;
      if(tr){ r.querySelector('#scNote').textContent='This adds an entry for the month, so you can see how much you spend each month.'; return; }
      r.querySelector('#scNote').textContent = v.startsWith('card:')?'For a card, this sets what you owe and its due and statement days.':v.startsWith('bill:')?'This updates the bill amount, bill date and due date.':''; };
    r.querySelector('#scTarget').onchange=note; note();
    r.querySelector('#scCancel').onclick=()=>{ URL.revokeObjectURL(url); if(multi&&!lastOne){ q.next(); } else closeSheet(); };
    r.querySelector('#scAdd').onclick=()=>{
      const v=r.querySelector('#scTarget').value; if(!v){ toast('Choose a bill or card'); return; }
      const amount=num(r.querySelector('#scAmt').value); if(amount<=0){ toast('Enter the amount'); return; }
      const bill=r.querySelector('#scBill').value||null, due=r.querySelector('#scDue').value||null;
      const [kind,id]=v.split(':'); let focusId='';
      if(kind==='bill'&&isTrack(v)){ const b=S.budgets.find(x=>x.id===id); const date=r.querySelector('#scTDate').value||iso(today()); const cardId=r.querySelector('#scPay').value||null;
        const t={id:uid(),ts:Date.now(),type:'expense',amount,cat:b.cat,cardId,date,note:b.name+' (scanned)'}; applyTxn(t,1); S.txns.push(t);
        viewMonth=parseISO(date.slice(0,8)+'01'); tab='budget'; toast(`Added ${fmt(amount)} to ${b.name} for ${MONTHS[parseISO(date).getMonth()]}`); focusId='b:'+b.id;
      } else if(kind==='bill'){ const b=S.budgets.find(x=>x.id===id); if(!b) return;
        b.amount=amount; if(bill) b.billDate=bill; if(due) b.dueDate=due;
        b.dueDay=b.dueDate?parseISO(b.dueDate).getDate():null; b.billDay=b.billDate?parseISO(b.billDate).getDate():null;
        tab='budget'; toast('Added to '+b.name); focusId='b:'+b.id;
      } else { const c=S.cards.find(x=>x.id===id); if(!c) return;
        c.balance=amount; c.stmtAmount=amount;
        if(due){ c.dueDate=due; c.dueDay=parseISO(due).getDate(); }
        if(bill){ c.statementDate=bill; c.statementDay=parseISO(bill).getDate(); }
        tab='cards'; toast('Updated '+c.name); focusId='c:'+c.id;
      }
      save(); URL.revokeObjectURL(url);
      if(multi&&!lastOne){ toast('Added'); render(); q.next(); return; }
      closeSheet(); render(); window.scrollTo(0,0);
      // jump to what was just updated
      setTimeout(()=>{ const el=document.querySelector(focusId.startsWith('b:')?`[data-budget="${focusId.slice(2)}"]`:`[data-card="${focusId.slice(2)}"]`);
        if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),2600); } },150);
    };
  });
}
$('#scanBtn').onclick=()=>$('#scanFile').click();
$('#scanFile').onchange=e=>{ const f=[...e.target.files]; e.target.value=''; if(f.length) scanFiles(f); };

load(); render(); importFromLink();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
